# =====================================================================
#  Allo Sante Tchad - configuration Netlify
#  Rien a modifier ici : tout se regle dans les variables
#  d'environnement du tableau de bord Netlify.
# =====================================================================

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Application monopage : toute URL renvoie vers index.html.
# (Le routeur interne utilise des ancres #/ donc ceci est une simple
#  ceinture de securite.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker et le manifeste ne doivent jamais etre mis en cache
# de facon agressive, sinon les mises a jour ne passent pas.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Les fichiers avec empreinte peuvent etre caches un an : c'est ce qui
# rend la 2e visite quasi instantanee en 2G.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- En-tetes de securite --------------------------------------------
# Deuxieme ligne de defense seulement : la premiere reste PostgreSQL
# (RLS + droits colonne par colonne). Ceux-ci protegent le navigateur
# du patient, pas la base.
[[headers]]
  for = "/*"
  [headers.values]
    # Le navigateur refuse le HTTP pendant un an apres la premiere
    # visite : sur un reseau mobile partage, la premiere requete en
    # clair est la seule fenetre d'interception.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    # DENY et non SAMEORIGIN : aucun site, pas meme le notre, n'a de
    # raison d'encadrer l'application. La page de connexion du
    # back-office serait sinon detournable par superposition.
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    # Micro (message vocal), appareil photo (ordonnance) et position
    # (detection de zone) restent ouverts au site lui-meme. Le reste
    # est coupe, y compris pour les iframes.
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=(self), payment=(), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=(), display-capture=()"
    # Rien ne se charge d'ailleurs que du site et de Supabase. Les
    # medias (vocal, photo d'ordonnance) sont recuperes par fetch puis
    # affiches en blob:, jamais par une URL externe dans src ; d'ou
    # blob: dans img-src et media-src, et Supabase seulement dans
    # connect-src. 'unsafe-inline' en style est du au bloc <style> de
    # demarrage dans index.html (ecran de chargement en 2G).
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://ffpxbefenbnhkicstyph.supabase.co; worker-src 'self'; manifest-src 'self'"

# --- Taches planifiees (gratuites sur Netlify) -----------------------
# Escalade des urgences vitales sans reponse : toutes les 5 minutes.
[functions."escalade"]
  schedule = "*/5 * * * *"

# Purge des photos d'ordonnance et messages vocaux : chaque nuit a 02h00 UTC.
[functions."purge-medias"]
  schedule = "0 2 * * *"
