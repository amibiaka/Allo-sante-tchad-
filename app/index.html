<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Allo Santé Tchad — ألو صحة تشاد</title>
    <meta name="description" content="Trouver et contacter un soignant, une pharmacie ou un centre de santé proche, partout au Tchad. Gratuit, sans inscription." />
    <meta name="theme-color" content="#0B4C8C" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Allo Santé" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- L'application se diffuse par WhatsApp : sans ces balises, le lien
         partagé n'affiche qu'une URL nue. Avec elles, chaque partage montre
         une carte avec le nom, la phrase d'accroche et le visuel. -->
    <link rel="canonical" href="https://afiyatchad.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Allo Santé Tchad" />
    <meta property="og:url" content="https://afiyatchad.com/" />
    <meta property="og:title" content="Allo Santé Tchad — urgences et soignants" />
    <meta property="og:description" content="Trouver et contacter un soignant, une pharmacie ou un centre de santé proche, partout au Tchad. Gratuit, sans inscription, sans téléchargement." />
    <meta property="og:image" content="https://afiyatchad.com/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Allo Santé Tchad — urgences, soignants et pharmacies partout au Tchad" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_TD" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Allo Santé Tchad — urgences et soignants" />
    <meta name="twitter:description" content="Trouver et contacter un soignant, une pharmacie ou un centre de santé proche, partout au Tchad. Gratuit, sans inscription." />
    <meta name="twitter:image" content="https://afiyatchad.com/icons/icon-512.png" />

    <!-- Aucune ressource externe : ni police, ni CDN, ni tracker. -->
    <style>
      :root { color-scheme: light }
      *,*::before,*::after { box-sizing: border-box }
      html,body { margin:0; padding:0 }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
        background:#F4F1EA; color:#04223F; -webkit-text-size-adjust:100%;
      }
      html[dir="rtl"] body { font-family: "Noto Naskh Arabic","Noto Sans Arabic",Amiri,"Segoe UI",Tahoma,system-ui,sans-serif }
      #demarrage {
        position:fixed; inset:0; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:1rem; padding:1.5rem; text-align:center;
      }
      #demarrage .logo {
        width:72px;height:72px;border-radius:20px;background:#0B4C8C;color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;
      }
      #demarrage p { margin:0; font-size:15px; color:#083A6B; font-weight:600 }
      #demarrage small { color:#5b6b7c; font-size:13px; max-width:22rem; display:block }
      .barre { width:150px;height:5px;border-radius:99px;background:#D3CCBB;overflow:hidden }
      .barre i { display:block;height:100%;width:40%;background:#0B4C8C;animation:g 1.1s infinite ease-in-out }
      @keyframes g { 0%{transform:translateX(-100%)} 100%{transform:translateX(310%)} }
      @media (prefers-reduced-motion: reduce) { .barre i { animation:none; width:100% } }
      noscript div { padding:1.25rem; font-size:15px; line-height:1.5 }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="demarrage">
        <div class="logo">+</div>
        <p>Allo Santé Tchad<br /><span style="font-weight:400">ألو صحة تشاد</span></p>
        <div class="barre"><i></i></div>
        <small>Chargement… / جارٍ التحميل…</small>
      </div>
    </div>
    <noscript>
      <div>
        <strong>JavaScript est désactivé.</strong><br />
        Cette application a besoin de JavaScript pour fonctionner.
        Activez-le dans les réglages de votre navigateur, puis rechargez la page.
        <hr />
        <strong>جافاسكريبت معطّل.</strong> يحتاج هذا التطبيق إلى تفعيل جافاسكريبت.
      </div>
    </noscript>

    <!-- Donnees structurees : dit aux moteurs ce qu'est ce site et pour qui.
         Rien n'est affirme qui ne soit verifiable : pas d'adresse, pas de
         numero, pas de note. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Allo Santé Tchad",
        "alternateName": "ألو صحة تشاد",
        "url": "https://afiyatchad.com/",
        "description": "Trouver et contacter un soignant, une pharmacie ou un centre de santé proche, partout au Tchad. Gratuit, sans inscription.",
        "inLanguage": ["fr", "ar"],
        "isAccessibleForFree": true,
        "audience": {
          "@type": "Audience",
          "geographicArea": { "@type": "Country", "name": "Tchad" }
        }
      }
    </script>

    <!-- Filet de secours : repare une page figee sur "Chargement...". -->
    <script src="/secours.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
